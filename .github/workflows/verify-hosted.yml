name: Verify hosted Panel
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Public HTTPS site origin, for example https://your-service.onrender.com'
        required: true
        type: string
      full_voice_matrix:
        description: 'Generate all 364 voice/expression combinations (uses server CPU)'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: hosted-validation
  cancel-in-progress: false
jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PANEL_TEST_URL: ${{ inputs.site_url }}
      FULL_VOICE_MATRIX: ${{ inputs.full_voice_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require a public HTTPS origin
        run: |
          python - <<'PY'
          import ipaddress, os
          from urllib.parse import urlsplit
          value = urlsplit(os.environ['PANEL_TEST_URL'])
          assert value.scheme == 'https' and value.hostname, 'Provide the HTTPS origin shown in your hosting dashboard.'
          assert not value.username and not value.password and not value.query and not value.fragment
          assert value.path in ('', '/') and value.port in (None, 443), 'Provide an origin without an application path.'
          assert value.hostname not in ('localhost', 'localhost.localdomain')
          try:
              address = ipaddress.ip_address(value.hostname)
          except ValueError:
              pass
          else:
              assert address.is_global, 'The target must be a public deployment.'
          PY
      - run: pip install pymupdf==1.26.6 opencv-python-headless==4.11.0.86 numpy==2.2.6 httpx==0.28.1 soundfile==0.13.1
      - name: Verify live uploads, OCR, character continuity and neural speech
        run: |
          voice_args=()
          if [ "$FULL_VOICE_MATRIX" = true ]; then voice_args+=(--full-matrix); fi
          python scripts/verify_deployment.py --base-url "$PANEL_TEST_URL" --same-origin "${voice_args[@]}" --report /tmp/panel-hosted-validation.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/make_test_pdf.py
      - name: Exercise the public site in Chromium
        run: npm run test:e2e -- e2e/hosted.spec.ts --workers=1
        working-directory: frontend
        env:
          PANEL_PUBLIC_CHECK: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-validation
          path: |
            /tmp/panel-hosted-validation.json
            frontend/test-results/
