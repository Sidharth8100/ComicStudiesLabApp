name: Verify Panel
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg libcairo2
      - run: pip install torch==2.5.1+cpu torchvision==0.20.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q tests
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          python scripts/make_test_pdf.py
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/panel.log 2>&1 &
          for i in $(seq 1 30); do curl --fail http://127.0.0.1:8000/api/health && break; sleep 1; done
      - run: npm run test:e2e
        working-directory: frontend
        env:
          CHROMIUM_PATH: ''
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
