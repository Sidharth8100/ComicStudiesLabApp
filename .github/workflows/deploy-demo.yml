name: Deploy temporary comic demo
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modal-demo-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require the connected hosting account
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo 'Add MODAL_TOKEN_ID and MODAL_TOKEN_SECRET in repository Actions secrets from your Modal account.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r deploy/modal-requirements.txt
      - name: Publish the ephemeral full-stack app
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy deploy/modal_app.py
